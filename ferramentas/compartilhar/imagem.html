<!DOCTYPE html>
<!-- A imagem de compartilhar da Família Linu (1200 × 630): o mapa das ilhas em 2× exato. Gerar de novo:
     node ferramentas/compartilhar/gerar.mjs -->
<html lang="pt-BR" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../css/fontes-pixel.css">
<link rel="stylesheet" href="../../css/estilo.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box; padding: 0 30px 0 56px; grid-template-columns: 1fr 774px !important; display: grid; grid-template-columns: 1fr 774px; gap: 36px; align-items: center; }
  h1 { font-size: 76px; line-height: 1; margin: 0; }
  .frase { font-size: 28px; line-height: 1.3; margin: 22px 0 0; color: #475569; }
  .pe { font: 500 24px "Pixelify Sans", sans-serif; color: #2563EB; margin: 30px 0 0; }
  .mapa-largo { display: block; width: 774px !important; }
  .mapa-largo img { width: 768px !important; height: 432px !important; }
</style></head><body>
  <div>
    <h1>Família Linu</h1>
    <p class="frase">Site, redes e segurança: cada irmão na sua ilha.</p>
    <p class="pe">familia.linupedia.com.br</p>
  </div>
  <div class="mapa-largo"><img class="pixel" src="../../img/mapa-largo-dia.png" alt="" width="384" height="216"></div>
</body></html>
